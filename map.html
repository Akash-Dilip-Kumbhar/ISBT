<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- Load Leaflet from CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin: 0; padding: 0; display: flex; font-family: sans-serif; height: 100vh; }
    #sidebar { width: 320px; padding: 20px; box-sizing: border-box; overflow-y: auto; background: #f8f9fa; border-right: 1px solid #ddd; }
    #map-container { flex-grow: 1; }
    #image-map { width: 100%; height: 100%; background: #eee; }
    #shop-search { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .shop-list-item { padding: 15px 10px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
    .shop-list-item:hover { background: #e9ecef; }
    .shop-list-item.active { background: #e2e6ea; border-left: 4px solid #007bff; }
    .shop-id { font-weight: bold; font-size: 1.1em; color: #333; }
    .shop-name { font-size: 0.95em; margin: 4px 0; }
    .shop-category { font-size: 0.85em; color: #666; margin-bottom: 8px; }
    .btn { display: inline-block; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-size: 0.85em; }
    .btn-outline-primary { color: #007bff; border: 1px solid #007bff; background: transparent; }
    .btn-outline-primary:hover { background: #007bff; color: white; }
  </style>
</head>

<body>
  <div id="sidebar">
    <h2>Shops</h2>
    <input type="text" id="shop-search" placeholder="Search shops by name or ID...">
    <div id="shop-list"></div>
  </div>
  <div id="map-container">
    <div id="image-map"></div>
  </div>
  <script>
    // 1. Define Image Bounds (pixel coordinates of the image)
    //    You MUST measure these from your actual shop drawing.
    var imageBounds = [[0, 0], [1200, 800]]; // Example: Width 1200px, Height 800px

    // 2. Create the Map with the custom CRS
    var map = L.map('image-map', {
      crs: L.CRS.Simple,
      minZoom: -5,
      maxZoom: 5,
      center: [0, 0],
      zoom: 0,
      attribution: '&copy; Your Shop Drawing Source'
    });

    // 3. Add the Image as a Layer
    L.imageOverlay('img/Maps/GroundFloor.jpg', imageBounds).addTo(map);

    // Set the map bounds to fit the image
    map.fitBounds(imageBounds);

    // 4. Define Shop Locations (Add your shops here)
    var shops = [
      {
        id: 'shop-gf-01',
        name: 'Shop GF-01',
        category: 'Retail',
        bounds: [[100, 50], [200, 150]], // Pixel coordinates for Shop 1
        popupContent: '<h2>Shop GF-01</h2><p>Category: Retail</p><a href="viewauction.html?shop=shop-gf-01">View Auction</a>'
      },
      {
        id: 'shop-gf-02',
        name: 'Shop GF-02',
        category: 'Food & Beverage',
        bounds: [[100, 200], [200, 300]], // Pixel coordinates for Shop 2
        popupContent: '<h2>Shop GF-02</h2><p>Category: Food & Beverage</p><a href="viewauction.html?shop=shop-gf-02">View Auction</a>'
      }
      // Add all your shops here following the same pattern
    ];

    // 5. Add Shop Markers
    shops.forEach(function (shop) {
      // Calculate the center of the shop bounds
      var shopCenter = [
        (shop.bounds[0][0] + shop.bounds[1][0]) / 2,
        (shop.bounds[0][1] + shop.bounds[1][1]) / 2
      ];

      // Add marker at shop center

      var popup = L.popup()
    .setLatLng(shopCenter)
    .setContent(shop.popupContent)
    .openOn(map);

    //   var marker = L.marker(shopCenter, {
    //     icon: L.divIcon({
    //       className: 'shop-marker',
    //       html: '<div style="background: #ff6b6b; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: white; font-weight: bold;">' + shop.id.split('-').pop() + '</div>',
    //       iconSize: [20, 20],
    //       iconAnchor: [10, 10]
    //     })
    //   }).addTo(map);

      // Add popup
    //   marker.bindPopup(shop.popupContent, { maxWidth: 300 });

      // Add layer for easy selection
      var shopLayer = L.rectangle(shop.bounds, {
        color: '#ff6b6b',
        weight: 2,
        fillOpacity: 0
      }).addTo(map);

      shopLayer.bindPopup(shop.popupContent, { maxWidth: 300 });

      // Highlight on hover
      shopLayer.on('mouseover', function () {
        this.setStyle({ fillOpacity: 0.2 });
      });

      shopLayer.on('mouseout', function () {
        this.setStyle({ fillOpacity: 0 });
      });

      // Add to a layer group
      if (!window.shopGroup) {
        window.shopGroup = L.layerGroup().addTo(map);
      }
      window.shopGroup.addLayer(shopLayer);
    });

    // 6. Add Layer Control
    var baseLayers = {
      'Shop Drawing': L.imageOverlay('img/Maps/GroundFloor.jpg', imageBounds),
      'Satellite View': L.tileLayer('http://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
      })
    };

    var overlayLayers = {
      'Shops': window.shopGroup
    };

    L.control.layers(baseLayers, overlayLayers).addTo(map);

    // 7. Auto-highlight shop from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const shopId = urlParams.get('shop');

    if (shopId) {
      const selectedShop = shops.find(s => s.id === shopId);
      if (selectedShop) {
        // Zoom to shop
        map.fitBounds(selectedShop.bounds, { padding: [50, 50] });

        // Open popup
        setTimeout(() => {
          window.shopGroup.getLayers().forEach(layer => {
            if (layer instanceof L.Rectangle && layer.getBounds().equals(selectedShop.bounds)) {
              layer.openPopup();
            }
          });
        }, 1000);

        // Highlight shop in list
        document.querySelectorAll('.shop-list-item').forEach(item => {
          if (item.dataset.shopId === shopId) {
            item.classList.add('active');
          } else {
            item.classList.remove('active');
          }
        });
      }
    }

    // 8. Search Functionality
    document.getElementById('shop-search').addEventListener('input', function (e) {
      const searchTerm = e.target.value.toLowerCase();
      const shopList = document.getElementById('shop-list');
      shopList.innerHTML = '';

      shops.filter(shop =>
        shop.name.toLowerCase().includes(searchTerm) ||
        shop.id.toLowerCase().includes(searchTerm)
      ).forEach(shop => {
        const item = document.createElement('div');
        item.classList.add('shop-list-item');
        item.dataset.shopId = shop.id;

        // Check if this is the selected shop
        if (shopId && shop.id === shopId) {
          item.classList.add('active');
        }

        item.innerHTML = `
          <div class="shop-id">${shop.id}</div>
          <div class="shop-name">${shop.name}</div>
          <div class="shop-category">${shop.category}</div>
          <a href="viewauction.html?shop=${shop.id}" class="btn btn-sm btn-outline-primary">View Auction</a>
        `;

        item.addEventListener('click', () => {
          map.fitBounds(shop.bounds, { padding: [50, 50] });
          window.shopGroup.getLayers().forEach(layer => {
            if (layer instanceof L.Rectangle && layer.getBounds().equals(L.latLngBounds(shop.bounds))) {
              layer.openPopup();
            }
          });
        });

        shopList.appendChild(item);
      });
    });
  </script>
</body>

</html>
